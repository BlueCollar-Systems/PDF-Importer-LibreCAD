name: auto-release

on:
  push:
    branches: [main, master]
    # Docs-only pushes do not mint a release (board Q-08-a / ANS-09-1).
    # Release-pipeline workflow edits under .github/ are NOT ignored: they must
    # rebuild --latest assets. The job if: guard skips chore: bump version to
    # commits, so there is no release loop.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "_archived/**"
      - "dist/_archived/**"
      - "dev_logs/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, 'automation/version-bump') && !contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_target: ${{ steps.target.outputs.sha }}
      # Publish must consult this, not just needs.release.result: a job whose
      # steps were all skipped still reports "success", so without it the
      # publisher would run against artifacts that were never built.
      release: ${{ steps.preflight.outputs.release }}
    # The image label is explicit; the accepted-artifact SHA gate below remains
    # authoritative because GitHub-hosted image contents can still evolve.
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          # Default GITHUB_TOKEN authenticates checkout and tag fetch.
          token: ${{ secrets.GITHUB_TOKEN }}

      # A release is minted only when this push actually prepared one, i.e. the
      # committed __version__ has no tag yet. Ordinary product commits do not
      # bump it, so without this guard every one of them built the source zip,
      # the portable zip and the candidate provenance, then failed several
      # minutes later -- here on "candidate source_zip SHA-256/size provenance
      # mismatch", which is the downstream symptom of an unprepared commit
      # reaching the release path at all. A pipeline that is red on ordinary
      # commits trains everyone to ignore it.
      #
      # Skipping is the correct outcome, not a failure: an unbumped version
      # means the author did not intend to release. Cutting one stays explicit.
      - name: Decide whether this push mints a release
        id: preflight
        run: |
          version="$(sed -n 's:^__version__[[:space:]]*=[[:space:]]*"\([0-9][0-9.]*\)".*:\1:p' \
            pdf2dxf.py | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from pdf2dxf.py"
            exit 1
          fi
          tag="v${version}"
          head="$(git rev-parse HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${version} has no tag yet - minting release ${tag}."
            exit 0
          fi

          tagged="$(git rev-list -n1 "refs/tags/${tag}")"
          echo "release=false" >> "$GITHUB_OUTPUT"
          if [ "$tagged" = "$head" ]; then
            echo "::notice::${tag} already points at this commit; nothing to mint."
          else
            echo "::notice::Skipping release: committed version is still ${version}, and ${tag} already points at ${tagged}. This commit changes the product without preparing a release, which is normal. To cut one, run scripts/prepare_release.py <new-version> and push that commit."
          fi

      - name: Set up Python
        if: steps.preflight.outputs.release == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Run release gate tests
        if: steps.preflight.outputs.release == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-release-win-py312.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci-win-py312.lock
          python pdfcadcore_sync_check.py --skip-cross-repo
          python preflight_check.py
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-librecad"

      - name: Read committed version
        if: steps.preflight.outputs.release == 'true'
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          cli = pathlib.Path("pdf2dxf.py")
          pyproject = pathlib.Path("pyproject.toml")

          cli_text = cli.read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"(\d+\.\d+\.\d+)"', cli_text)
          if not match:
              raise SystemExit("Could not parse __version__ from pdf2dxf.py")
          version = match.group(1)

          pyproject_text = pyproject.read_text(encoding="utf-8")
          pyproject_match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"', pyproject_text, re.MULTILINE)
          if not pyproject_match or pyproject_match.group(1) != version:
              got = pyproject_match.group(1) if pyproject_match else "missing"
              raise SystemExit(f"Version mismatch: cli={version} pyproject={got}")

          readme_text = pathlib.Path("README.md").read_text(encoding="utf-8")
          readme_match = re.search(r'Version-(\d+\.\d+\.\d+)-blue', readme_text)
          if not readme_match or readme_match.group(1) != version:
              got = readme_match.group(1) if readme_match else "missing"
              raise SystemExit(f"Version mismatch: cli={version} README badge={got}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Set release target
        if: steps.preflight.outputs.release == 'true'
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build source zip
        if: steps.preflight.outputs.release == 'true'
        run: python build_release.py

      - name: Build Windows portable zip
        if: steps.preflight.outputs.release == 'true'
        run: python build_windows_portable.py

      - name: Smoke Windows portable zip
        if: steps.preflight.outputs.release == 'true'
        run: python scripts/smoke_portable_zip.py "dist/LibreCAD-PDF-Importer-Windows-Portable_v*.zip" --source-zip "dist/LibreCAD-PDF-Importer_v*.zip"

      - name: Write candidate provenance
        if: steps.preflight.outputs.release == 'true'
        run: python scripts/verify_release_artifacts.py --write-candidate-provenance dist/release-candidate-provenance.json

      - name: Attest release candidate files
        if: steps.preflight.outputs.release == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/LibreCAD-PDF-Importer_v${{ steps.version.outputs.version }}.zip
            dist/LibreCAD-PDF-Importer-Windows-Portable_v${{ steps.version.outputs.version }}.zip
            dist/release-candidate-provenance.json

      - name: Verify exact accepted release bytes
        if: steps.preflight.outputs.release == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_artifacts.py

      # A mismatched hosted-runner build must never publish, but retaining the
      # exact candidate briefly lets maintainers inspect and explicitly accept
      # a runner-distribution difference instead of weakening this gate.
      - name: Retain failed release candidate for acceptance
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/LibreCAD-PDF-Importer-Windows-Portable_v*.zip
            dist/LibreCAD-PDF-Importer_v*.zip
            dist/release-candidate-provenance.json
            .release/accepted-artifacts.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Transfer verified release archives to publisher
        if: steps.preflight.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/LibreCAD-PDF-Importer-Windows-Portable_v*.zip
            dist/LibreCAD-PDF-Importer_v*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: release
    # A release job whose steps were all skipped still reports "success", so the
    # explicit decision is required too; otherwise the publisher runs against
    # artifacts that were never built.
    if: needs.release.result == 'success' && needs.release.outputs.release == 'true'
    permissions:
      actions: read
      contents: write
    runs-on: windows-2025
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "verified-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dir dist

      - name: Reverify transferred release bytes
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          root = Path.cwd().resolve()
          manifest_path = root / ".release" / "accepted-artifacts.json"
          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8"),
              object_pairs_hook=strict_object,
              parse_constant=reject_constant,
          )
          schema = manifest.get("schema")
          expected_top = {"schema", "version", "build_contract", "artifacts"}
          if schema == "bcs.release_artifacts/1.1":
              expected_top.add("provenance")
          elif schema != "bcs.release_artifacts/1.0":
              raise SystemExit(f"Unsupported accepted manifest schema: {schema!r}")
          if set(manifest) != expected_top:
              raise SystemExit("Accepted manifest has an unexpected top-level shape")

          version = os.environ["EXPECTED_VERSION"]
          if manifest["version"] != version:
              raise SystemExit("Accepted manifest version does not match release version")
          artifacts = manifest["artifacts"]
          if not isinstance(artifacts, dict):
              raise SystemExit("Accepted manifest artifacts must be an object")
          zip_records = {
              key: value for key, value in artifacts.items() if key.endswith("_zip")
          }
          expected_paths = {
              "source_zip": f"dist/LibreCAD-PDF-Importer_v{version}.zip",
              "portable_zip": (
                  f"dist/LibreCAD-PDF-Importer-Windows-Portable_v{version}.zip"
              ),
          }
          if set(zip_records) != set(expected_paths):
              raise SystemExit("Accepted manifest must contain exactly two ZIP records")

          for name, expected_relative in expected_paths.items():
              record = zip_records[name]
              if not isinstance(record, dict) or set(record) != {
                  "path",
                  "sha256",
                  "size_bytes",
              }:
                  raise SystemExit(f"Accepted {name} record has an invalid shape")
              digest = record["sha256"]
              size = record["size_bytes"]
              if (
                  record["path"] != expected_relative
                  or not isinstance(digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", digest) is None
                  or not isinstance(size, int)
                  or isinstance(size, bool)
                  or size < 0
              ):
                  raise SystemExit(f"Accepted {name} record is invalid")
              path = root / expected_relative
              if not path.is_file() or path.is_symlink() or path.stat().st_size != size:
                  raise SystemExit(f"Transferred {name} path/size is invalid")
              sha256 = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      sha256.update(chunk)
              if sha256.hexdigest() != digest:
                  raise SystemExit(f"Transferred {name} SHA-256 mismatch")
          PY

      - name: Check whether release already exists
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${{ needs.release.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — immutable; skipping asset upload."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # This repository-controlled script deliberately has no write token in its
      # environment, and checkout did not persist credentials.
      - name: Audit existing release tag
        if: steps.release_state.outputs.exists == 'true'
        run: |
          python scripts/release_safety.py audit-existing-tag \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "v${{ needs.release.outputs.version }}" \
            --before "${{ github.event.before }}" \
            --head "$GITHUB_SHA" \
            --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --mode release \
            --summary "$GITHUB_STEP_SUMMARY" \
            --warnings-file .release-safety/warnings.json

      - name: Create release
        if: steps.release_state.outputs.exists != 'true'
        id: mint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${{ needs.release.outputs.version }}"
          TITLE="v${{ needs.release.outputs.version }} — PDF to DXF Converter for LibreCAD"
          VERSION="${{ needs.release.outputs.version }}"
          RELEASE_TARGET="${{ needs.release.outputs.release_target }}"
          PORTABLE="dist/LibreCAD-PDF-Importer-Windows-Portable_v${VERSION}.zip"
          SOURCE="dist/LibreCAD-PDF-Importer_v${VERSION}.zip"

          # Create the tag through the releases API. No repository-controlled
          # executable is invoked while the contents:write token is exported.
          gh release create "$TAG" --target "${RELEASE_TARGET:-$GITHUB_SHA}" --title "$TITLE" --generate-notes --latest "$PORTABLE" "$SOURCE"
          echo "minted=true" >> "$GITHUB_OUTPUT"

      - name: Check website dispatch token secret
        if: steps.mint.outputs.minted == 'true'
        id: website_dispatch_token
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch website release update
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            const tag = 'v${{ needs.release.outputs.version }}';
            const payload = {
              source_repo: context.repo.owner + '/' + context.repo.repo,
              source_event: 'auto-release',
              source_ref: context.ref,
              source_sha: context.sha,
              release_tag: tag,
              release_name: tag,
              release_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: 'BlueCollar-Systems',
              repo: 'BlueCollar-Website',
              event_type: 'product-release',
              client_payload: payload,
            });

            core.info('Dispatched product-release to BlueCollar-Website');

      - name: Warn when website dispatch token is missing
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."
